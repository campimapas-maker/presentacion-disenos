<text x="1006" y="314" font-size="15" fill="#1d1d1d">Intervalo de los agujeros: <tspan font-weight="bold">252 mm</tspan></text>

<path d="M1002,418 L972,458" stroke="#c81414" stroke-width="1.2" fill="none" marker-end="url(#aR)"/>
