<text x="1006" y="409" font-size="15" fill="#c81414">Altura fija: <tspan font-weight="bold">55 mm</tspan> desde la base</text>

<!-- ================= CUADRO DE REGLAS ================= -->
<rect x="1000" y="440" width="392" height="350" fill="#EDEBD3" stroke="#2b2b2b" stroke-width="2"/>
<text x="1196" y="472" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d1d1d">REGLAS DE MONTAJE GENERALES</text>
<line x1="1018" y1="482" x2="1374" y2="482" stroke="#2b2b2b" stroke-width="1.2"/>

<g font-size="15" fill="#1d1d1d">
  <text x="1018" y="508">· Medir <tspan font-weight="bold">43 mm</tspan> desde el frente de cajón (hacia</text>
  <text x="1028" y="527">arriba) al centro del agujereado de la corredera.</text>

  <text x="1018" y="556" fill="#c81414">· <tspan font-weight="bold">El primer cajón queda a 55 mm de altura</tspan></text>
  <text x="1028" y="575" fill="#c81414"><tspan font-weight="bold">fijo</tspan>, medido desde la base interior del mueble</text>
  <text x="1028" y="594" fill="#c81414">al centro del agujereado de la corredera.</text>

  <text x="1018" y="623">· El resto de los cajones, con la medida que</text>
  <text x="1028" y="642">te indiquen.</text>

  <text x="1018" y="671">· Las correderas van a <tspan font-weight="bold">30 mm hacia adentro</tspan>,</text>
  <text x="1028" y="690">tanto la de 500 como la de 400.</text>

  <text x="1018" y="719">· Intervalos de los agujeros:</text>
  <text x="1028" y="738"><tspan font-weight="bold">252 mm</tspan> = corredera de <tspan font-weight="bold">400</tspan></text>
  <text x="1028" y="757"><tspan font-weight="bold">307 mm</tspan> = corredera de <tspan font-weight="bold">500</tspan></text>
</g>
</svg>
