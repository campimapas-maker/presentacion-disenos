<text x="300" y="776" font-size="15.5" fill="#c81414">El primer cajón queda a <tspan font-weight="bold">55 mm de altura fijo</tspan>: se mide desde la <tspan font-weight="bold">base</tspan></text>
<text x="300" y="794" font-size="15.5" fill="#c81414"><tspan font-weight="bold">interior del mueble</tspan> hacia arriba, al <tspan font-weight="bold">centro del agujereado de la corredera</tspan>.</text>

