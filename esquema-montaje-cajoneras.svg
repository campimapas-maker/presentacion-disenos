<text x="600" y="744" text-anchor="end" font-size="14.5" font-weight="bold" fill="#c81414">ALTURA FIJA</text>
<path d="M698,737 L674,694" stroke="#2b2b2b" stroke-width="1.1" fill="none" marker-end="url(#aK)"/>
