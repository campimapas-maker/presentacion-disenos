<line x1="706" y1="648.5" x2="690" y2="659.8" stroke="#c81414" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="690" y1="659.8" x2="646" y2="659.8" stroke="#c81414" stroke-width="1" stroke-dasharray="4 3"/>
