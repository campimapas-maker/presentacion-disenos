<!-- ================= LLAMADAS DERECHA ================= -->
<path d="M1002,216 L908,340" stroke="#2b2b2b" stroke-width="1.2" fill="none" marker-end="url(#aK)"/>
<text x="1006" y="186" font-size="17" font-weight="bold" fill="#1d1d1d">Corredera de 500</text>
<text x="1006" y="209" font-size="15" fill="#1d1d1d">Intervalo de los agujeros: <tspan font-weight="bold">307 mm</tspan></text>

<path d="M1002,322 L874,446" stroke="#2b2b2b" stroke-width="1.2" fill="none" marker-end="url(#aK)"/>
